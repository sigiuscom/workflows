name: docker-build (reusable)

on:
  workflow_call:
    inputs:
      context:
        type: string
        required: false
        default: '.'
      dockerfile:
        description: Path to Dockerfile (default = {context}/Dockerfile)
        type: string
        required: false
        default: ''
      image:
        description: Full image name without tag (e.g. ghcr.io/sigiuscom/foo)
        type: string
        required: true
      push:
        description: Push images when true; false runs a build-only validation
        type: boolean
        required: false
        default: false
      platforms:
        type: string
        required: false
        default: 'linux/amd64'
      build-args:
        type: string
        required: false
        default: ''
      registry-mirrors:
        description: Newline-separated Kaniko registry mirrors for Docker Hub pulls
        type: string
        required: false
        default: ''
      registry-maps:
        description: Newline-separated Kaniko registry map entries, e.g. index.docker.io=mirror.local:5000
        type: string
        required: false
        default: ''
      insecure-registries:
        description: Newline-separated registries Kaniko may use over plain HTTP
        type: string
        required: false
        default: ''
      image-download-retry:
        description: Number of retries for Kaniko base image downloads
        type: string
        required: false
        default: '3'
      kaniko-memory-limit:
        description: Kubernetes memory limit for the ephemeral Kaniko build pod
        type: string
        required: false
        default: '3Gi'
      registry:
        type: string
        required: false
        default: 'ghcr.io'
      version:
        description: Explicit semver to tag with (e.g. 1.2.3). Generates :1.2.3, :1.2, :1, :latest.
        type: string
        required: false
        default: ''
      ref:
        description: Git ref to check out (default = caller's ref). Useful when bump-version pushed a tag.
        type: string
        required: false
        default: ''
      trivy-scan:
        description: Run Trivy vulnerability scan on the built image (requires push=true)
        type: boolean
        required: false
        default: true
      trivy-severity:
        description: Trivy severity filter
        type: string
        required: false
        default: 'HIGH,CRITICAL'
      trivy-ignore-unfixed:
        description: Ignore unfixed vulnerabilities
        type: boolean
        required: false
        default: true
      trivy-server:
        description: Shared Trivy server URL for vulnerability DB and result cache
        type: string
        required: false
        default: 'http://trivy-service.trivy-system:4954'
      trivy-timeout:
        description: Maximum duration of one image vulnerability scan
        type: string
        required: false
        default: '10m'
      build-timeout-minutes:
        description: >-
          Total budget for this job, covering every build attempt. The wait for a
          Kaniko Job ends five minutes before it so the timeout can be reported
          rather than surfacing as a cancelled job.
        type: number
        required: false
        default: 45
      kaniko-cache:
        description: Reuse pushed image layers through a remote Kaniko cache
        type: boolean
        required: false
        default: true
      kaniko-cache-ttl:
        description: Maximum age of remote Kaniko cache entries
        type: string
        required: false
        default: '168h'
    outputs:
      image-tag:
        description: Primary immutable image tag selected by the build
        value: ${{ jobs.build.outputs.image-tag }}
      image-digest:
        description: Registry digest of the pushed primary image
        value: ${{ jobs.build.outputs.image-digest }}
      image-ref:
        description: Primary tag pinned to its registry digest
        value: ${{ jobs.build.outputs.image-ref }}
    secrets:
      GHCR_TOKEN:
        required: false
      REGISTRY_USERNAME:
        description: Registry username when the target is not GHCR (e.g. an ACR scope-map token)
        required: false
      REGISTRY_PASSWORD:
        description: Registry password when the target is not GHCR
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: aks-self-hosted
    # Backstop above the inner wait: a stuck build must not hold a runner for
    # GitHub's 360-minute default while other jobs queue behind it. Derived from the
    # input rather than fixed, so raising the wait does not create a job that GitHub
    # kills before its own timeout can report anything.
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    outputs:
      image-tag: ${{ steps.tags.outputs.primary }}
      image-digest: ${{ steps.tags.outputs.digest }}
      image-ref: ${{ steps.tags.outputs.reference }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      KANIKO_NAMESPACE: ci-builds
      KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.24.0-debug
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ inputs.platforms }}" != "linux/amd64" ]; then
            echo "::error::Kaniko workflow currently supports linux/amd64 only, got '${{ inputs.platforms }}'"
            exit 1
          fi
          retry="${{ inputs.image-download-retry }}"
          if [ -z "$retry" ]; then
            echo "::error::image-download-retry must be a non-negative integer"
            exit 1
          fi
          case "$retry" in
            *[!0-9]*)
              echo "::error::image-download-retry must be a non-negative integer, got '${retry}'"
              exit 1
              ;;
          esac
          # type: number does not mean integer, and the value drives shell arithmetic
          # twice -- a fractional one aborts the step, a zero empties the wait loop.
          timeout="${{ inputs.build-timeout-minutes }}"
          case "$timeout" in
            ''|*[!0-9]*)
              echo "::error::build-timeout-minutes must be a positive integer, got '${timeout}'"
              exit 1
              ;;
          esac
          # The shell window is the budget minus five minutes, so anything below six
          # leaves no window at all and the loop would never poll.
          if [ "$timeout" -lt 6 ]; then
            echo "::error::build-timeout-minutes must be at least 6, got '${timeout}'"
            exit 1
          fi

      - name: Install kubectl
        run: |
          curl -fsSL -o /tmp/kubectl https://dl.k8s.io/release/v1.36.1/bin/linux/amd64/kubectl
          chmod +x /tmp/kubectl
          /tmp/kubectl version --client=true

      - name: Configure in-cluster kubectl
        run: |
          server="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"
          token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          ca="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          /tmp/kubectl config set-cluster in-cluster --server="$server" --certificate-authority="$ca"
          /tmp/kubectl config set-credentials runner --token="$token"
          /tmp/kubectl config set-context in-cluster --cluster=in-cluster --user=runner --namespace="$KANIKO_NAMESPACE"
          /tmp/kubectl config use-context in-cluster
          /tmp/kubectl auth can-i create jobs.batch -n "$KANIKO_NAMESPACE"

      - name: Build image with Kaniko
        id: tags
        env:
          INPUT_CONTEXT: ${{ inputs.context }}
          INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_BUILD_ARGS: ${{ inputs.build-args }}
          INPUT_REGISTRY_MIRRORS: ${{ inputs.registry-mirrors }}
          INPUT_REGISTRY_MAPS: ${{ inputs.registry-maps }}
          INPUT_INSECURE_REGISTRIES: ${{ inputs.insecure-registries }}
          INPUT_IMAGE_DOWNLOAD_RETRY: ${{ inputs.image-download-retry }}
          INPUT_KANIKO_MEMORY_LIMIT: ${{ inputs.kaniko-memory-limit }}
          INPUT_BUILD_TIMEOUT_MINUTES: ${{ inputs.build-timeout-minutes }}
          INPUT_KANIKO_CACHE: ${{ inputs.kaniko-cache }}
          INPUT_KANIKO_CACHE_TTL: ${{ inputs.kaniko-cache-ttl }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          job_base="kaniko-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}"
          docker_secret="${job_base}-docker"
          git_secret="${job_base}-git"
          ref="${INPUT_REF:-$GITHUB_SHA}"
          context="${INPUT_CONTEXT#./}"
          if [ -z "$context" ]; then
            context="."
          fi

          dockerfile="$INPUT_DOCKERFILE"
          if [ -z "$dockerfile" ]; then
            dockerfile="Dockerfile"
          else
            dockerfile="${dockerfile#./}"
            if [ "$context" != "." ]; then
              prefix="${context%/}/"
              dockerfile="${dockerfile#$prefix}"
            fi
          fi

          ref_name="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA:0:7}"
          tags_file="/tmp/${job_base}-tags.txt"
          : > "$tags_file"
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            echo "${INPUT_IMAGE}:${version}" >> "$tags_file"
            major_minor="$(printf '%s' "$version" | awk -F. '{print $1"."$2}')"
            major="$(printf '%s' "$version" | awk -F. '{print $1}')"
            echo "${INPUT_IMAGE}:${major_minor}" >> "$tags_file"
            echo "${INPUT_IMAGE}:${major}" >> "$tags_file"
            echo "${INPUT_IMAGE}:latest" >> "$tags_file"
          else
            echo "${INPUT_IMAGE}:${ref_name}-${short_sha}" >> "$tags_file"
            echo "${INPUT_IMAGE}:${ref_name}" >> "$tags_file"
          fi

          primary_tag="$(head -1 "$tags_file")"
          echo "primary=${primary_tag}" >> "$GITHUB_OUTPUT"

          /tmp/kubectl delete secret "$docker_secret" "$git_secret" -n "$KANIKO_NAMESPACE" --ignore-not-found
          cleanup_secrets() {
            /tmp/kubectl delete secret "$docker_secret" "$git_secret" \
              -n "$KANIKO_NAMESPACE" --ignore-not-found >/dev/null 2>&1 || true
          }
          trap cleanup_secrets EXIT
          # The registry credential is a PUSH credential, and it is only ever needed to push.
          # A build-only validation runs an untrusted Dockerfile -- every RUN in a pull request's
          # Dockerfile is code the author chose -- so handing it write access to the registry
          # trades away the whole point of `push: false`. Base images are public and come through
          # the zot mirror, so a build-only Kaniko needs no registry auth at all.
          if [ "$INPUT_PUSH" = "true" ]; then
            /tmp/kubectl create secret docker-registry "$docker_secret" \
              --namespace "$KANIKO_NAMESPACE" \
              --docker-server "$INPUT_REGISTRY" \
              --docker-username "${REGISTRY_USERNAME:-$GITHUB_ACTOR}" \
              --docker-password "${REGISTRY_PASSWORD:-${GHCR_TOKEN:-$GH_TOKEN}}"
          fi
          /tmp/kubectl create secret generic "$git_secret" \
            --namespace "$KANIKO_NAMESPACE" \
            --from-literal=GIT_USERNAME="$GITHUB_ACTOR" \
            --from-literal=GIT_PASSWORD="$GH_TOKEN"

          # Only a pushing build gets the registry credential mounted. Both blocks stay empty on a
          # build-only run, so the Job manifest references no docker secret at all -- there is
          # nothing for an untrusted RUN to read out of /kaniko/.docker.
          docker_mount_file="/tmp/${job_base}-docker-mount.yaml"
          docker_volume_file="/tmp/${job_base}-docker-volume.yaml"
          : > "$docker_mount_file"
          : > "$docker_volume_file"
          # printf, not a heredoc: a nested heredoc terminator has to sit at column 0, which ends
          # the enclosing YAML block scalar. The indentation below is the Job manifest's own.
          if [ "$INPUT_PUSH" = "true" ]; then
            printf '%s\n' \
              "          volumeMounts:" \
              "            - name: docker-config" \
              "              mountPath: /kaniko/.docker" > "$docker_mount_file"
            printf '%s\n' \
              "      volumes:" \
              "        - name: docker-config" \
              "          projected:" \
              "            sources:" \
              "              - secret:" \
              "                  name: ${docker_secret}" \
              "                  items:" \
              "                    - key: .dockerconfigjson" \
              "                      path: config.json" > "$docker_volume_file"
          fi

          args_file="/tmp/${job_base}-args.yaml"
          : > "$args_file"
          add_arg() {
            printf '                - %s\n' "$1" >> "$args_file"
          }

          github_host="${GITHUB_SERVER_URL#https://}"
          add_arg "--context=git://${github_host}/${GITHUB_REPOSITORY}.git#${ref}"
          if [ "$context" != "." ]; then
            add_arg "--context-sub-path=${context}"
          fi
          add_arg "--dockerfile=${dockerfile}"
          add_arg "--verbosity=info"
          add_arg "--push-retry=2"
          add_arg "--digest-file=/dev/termination-log"
          if [ "$INPUT_IMAGE_DOWNLOAD_RETRY" != "0" ]; then
            add_arg "--image-download-retry=${INPUT_IMAGE_DOWNLOAD_RETRY}"
          fi
          if [ "$INPUT_PUSH" != "true" ]; then
            add_arg "--no-push"
          elif [ "$INPUT_KANIKO_CACHE" = "true" ]; then
            add_arg "--cache=true"
            add_arg "--cache-repo=${INPUT_IMAGE}-cache"
            add_arg "--cache-ttl=${INPUT_KANIKO_CACHE_TTL}"
          fi
          while IFS= read -r registry_mirror; do
            if [ -n "$registry_mirror" ]; then
              add_arg "--registry-mirror=${registry_mirror}"
            fi
          done <<EOF_REGISTRY_MIRRORS
          $INPUT_REGISTRY_MIRRORS
          EOF_REGISTRY_MIRRORS
          while IFS= read -r registry_map; do
            if [ -n "$registry_map" ]; then
              add_arg "--registry-map=${registry_map}"
            fi
          done <<EOF_REGISTRY_MAPS
          $INPUT_REGISTRY_MAPS
          EOF_REGISTRY_MAPS
          while IFS= read -r insecure_registry; do
            if [ -n "$insecure_registry" ]; then
              add_arg "--insecure-registry=${insecure_registry}"
            fi
          done <<EOF_INSECURE_REGISTRIES
          $INPUT_INSECURE_REGISTRIES
          EOF_INSECURE_REGISTRIES
          # Shared platform pull-through cache (infra-zot): route Docker Hub through it so builds
          # never hit the anonymous Docker Hub rate limit (Spegel is a peer mirror and never holds
          # Kaniko FROM bases). Baked in unconditionally -- in addition to any caller mirrors --
          # because ci-builds always runs in-cluster where zot.zot.svc is reachable. See azinfra
          # docs/zot-pull-through-cache.md.
          zot_cache="zot.zot.svc.cluster.local:5000"
          add_arg "--registry-map=index.docker.io=${zot_cache}"
          # zot serves TLS (cert-manager self-signed); pull over HTTPS but skip cert verification --
          # source authentication is the CiliumNetworkPolicy, encryption is TLS. See azinfra
          # docs/zot-pull-through-cache.md "Security".
          add_arg "--skip-tls-verify-registry=${zot_cache}"
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              add_arg "--destination=${tag}"
            fi
          done < "$tags_file"
          while IFS= read -r build_arg; do
            if [ -n "$build_arg" ]; then
              add_arg "--build-arg=${build_arg}"
            fi
          done <<EOF_BUILD_ARGS
          $INPUT_BUILD_ARGS
          EOF_BUILD_ARGS

          render_job() {
            job="$1"
            cat > "/tmp/${job}.yaml" <<EOF_JOB
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${job}
            namespace: ${KANIKO_NAMESPACE}
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 600
            # Survives the runner. The shell reaps the Job when it stops waiting, but only
            # if it is alive to do it: an evicted or cancelled runner would otherwise leave
            # Kaniko snapshotting against a disk the next build needs, forever.
            #
            # Deliberately later than the shell's own window. The loop spends
            # build_deadline_seconds sleeping plus two API round trips per iteration, so
            # a deadline equal to it always wins -- and then the build reports as
            # DeadlineExceeded, which reads as a broken Dockerfile instead of a timeout.
            # A backstop that fires first is not a backstop.
            activeDeadlineSeconds: ${build_backstop_seconds}
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: ${job}
                  app.kubernetes.io/component: kaniko-build
                annotations:
                  # backoffLimit is 0, so anything that stops this pod fails the build outright.
                  # Karpenter consolidation/drift evicted a mid-flight build (2026-07-31,
                  # "Evicted pod: Drifted"), which reads as a broken Dockerfile in CI and is not.
                  # A build is short-lived; excluding it from disruption costs nothing.
                  karpenter.sh/do-not-disrupt: "true"
              spec:
                # The build never talks to the API server -- the runner does, from outside this
                # pod. An untrusted Dockerfile's RUN should not find a token here.
                automountServiceAccountToken: false
                restartPolicy: Never
                # What actually saturates during a CI wave is disk: several Kaniko pods
                # snapshotting a full filesystem on one node's disk sit at 13-35 millicores
                # while the node's CPU is at 4-7 percent. Measured 2026-09-17: 12 builds
                # at once put 7 on a single node and every one of them missed its window.
                # Spreading them costs no queueing -- unlike a concurrency cap, a build
                # still starts immediately; it just starts somewhere else.
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: kubernetes.io/hostname
                    whenUnsatisfiable: ScheduleAnyway
                    # This pod tolerates nothing, so the kata and system pools are
                    # domains it can never enter. Counting them only dilutes the skew.
                    nodeTaintsPolicy: Honor
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: kaniko-build
                containers:
                  - name: kaniko
                    image: ${KANIKO_IMAGE}
                    args:
          $(cat "$args_file")
                    env:
                      - name: DOCKER_CONFIG
                        value: /kaniko/.docker
                      - name: GIT_USERNAME
                        valueFrom:
                          secretKeyRef:
                            name: ${git_secret}
                            key: GIT_USERNAME
                      - name: GIT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: ${git_secret}
                            key: GIT_PASSWORD
          $(cat "$docker_mount_file")
                    resources:
                      requests:
                        cpu: 250m
                        memory: 512Mi
                      limits:
                        cpu: "2"
                        memory: ${INPUT_KANIKO_MEMORY_LIMIT}
          $(cat "$docker_volume_file")
          EOF_JOB
          }

          # The Kaniko Job is created through the cluster's admission chain, which includes the
          # AKS-managed safeguards mutating webhook (failurePolicy: Fail). When that webhook is
          # briefly unreachable every Job CREATE in the cluster fails with a 500, and a build
          # that was fine dies for a reason that has nothing to do with it -- observed
          # 2026-07-30, when it also took the GitHub Release step with it.
          #
          # Retry ONLY that call, and only for faults that look transient. A bad manifest, a
          # missing RBAC grant or a rejected admission policy must still fail on the first
          # attempt: retrying those hides a real error behind a slower red build. `apply` is
          # idempotent, so a retry after a partially-applied attempt is safe.
          apply_job() {
            job="$1"
            attempt=1
            max_attempts=5
            delay=2
            while :; do
              out="$(/tmp/kubectl apply -f "/tmp/${job}.yaml" 2>&1)" && rc=0 || rc=$?
              printf '%s\n' "$out"
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "kaniko: job apply still failing after ${attempt} attempts" >&2
                return "$rc"
              fi
              case "$out" in
                *"failed calling webhook"*|*InternalError*|*ServiceUnavailable*|\
                *"connection refused"*|*"TLS handshake timeout"*|*"i/o timeout"*|\
                *"etcdserver: request timed out"*|\
                *"the server is currently unable to handle the request"*)
                  echo "kaniko: transient API-server fault, retry ${attempt}/${max_attempts} in ${delay}s" >&2
                  sleep "$delay"
                  delay=$((delay * 2))
                  attempt=$((attempt + 1))
                  ;;
                *)
                  echo "kaniko: apply failed with a non-transient error; not retrying" >&2
                  return "$rc"
                  ;;
              esac
            done
          }

          is_transient_build_failure() {
            grep -Eiq \
              'BLOB_UNKNOWN|i/o timeout|TLS handshake timeout|connection reset by peer|unexpected EOF|temporary failure in name resolution|dial tcp.*(timeout|connection refused)|stream error: stream ID [0-9]+; INTERNAL_ERROR; received from peer' \
              "$1"
          }

          build_attempt=1
          max_build_attempts=3
          # The input is the whole budget for this job, and the bounds count down from
          # it so each can report before the next one fires: the shell gives up five
          # minutes early and says so, the Job's own deadline follows two minutes later
          # and survives a dead runner, and GitHub's job timeout is the last resort.
          # Equal bounds would mean the outer one always wins, and a build that merely
          # ran long would be reported as a broken Dockerfile.
          #
          # The budget covers all attempts, not one. A BLOB_UNKNOWN -- the fault the
          # retry exists for -- happens on push, at the end of a build, so budgeting
          # one attempt would leave the retry unreachable in exactly the case it was
          # written for.
          #
          # The wait is measured against the clock rather than counted in iterations.
          # Each pass also pays two API round trips, so a loop of N sleeps runs longer
          # than N*5 seconds by an amount that grows with N: a fixed headroom over a
          # counted loop holds at a small budget and silently stops holding at a large
          # one, which is the opposite of what a backstop should do.
          budget_seconds="$(( (10#$INPUT_BUILD_TIMEOUT_MINUTES - 5) * 60 ))"
          budget_end_ts="$(( $(date +%s) + budget_seconds ))"
          min_attempt_seconds=60
          retry_delay=2
          successful_job=""
          while [ "$build_attempt" -le "$max_build_attempts" ]; do
            remaining="$(( budget_end_ts - $(date +%s) ))"
            if [ "$remaining" -lt "$min_attempt_seconds" ]; then
              echo "kaniko: ${remaining}s of the build budget left, not starting attempt ${build_attempt}" >&2
              exit 1
            fi
            # The Job's own deadline trails this attempt's window, so a runner that
            # dies mid-attempt still leaves a Job that stops on its own.
            attempt_end_ts="$budget_end_ts"
            build_backstop_seconds="$(( remaining + 120 ))"
            job="${job_base}-${build_attempt}"
            logs_file="/tmp/${job}-logs.txt"
            /tmp/kubectl delete job "$job" -n "$KANIKO_NAMESPACE" --ignore-not-found
            render_job "$job"
            apply_job "$job"

            # A runner-sized image takes about 8 minutes on a quiet cluster and close
            # to 19 when several builds snapshot the filesystem at once. The window used
            # to be 900s, which failed builds that were going to succeed and, because the
            # expiry path did not delete the Job, left the pod running to compete with
            # the next wave for the same disk.
            status=1
            timed_out=0
            # set -u is in effect and the loop may never run, so an unset value here
            # would kill the step before it reaps the Job it is waiting on.
            complete=""
            failed=""
            attempt_started_ts="$(date +%s)"
            while [ "$(date +%s)" -lt "$attempt_end_ts" ]; do
              complete="$(/tmp/kubectl get "job/${job}" -n "$KANIKO_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
              failed="$(/tmp/kubectl get "job/${job}" -n "$KANIKO_NAMESPACE" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
              if [ "$complete" = "True" ]; then
                status=0
                break
              fi
              if [ "$failed" = "True" ]; then
                break
              fi
              sleep 5
            done
            waited="$(( $(date +%s) - attempt_started_ts ))"
            if [ "$status" -ne 0 ] && [ "$complete" != "True" ] && [ "$failed" != "True" ]; then
              timed_out=1
              echo "kaniko: build did not finish within ${waited}s" >&2
            fi
            /tmp/kubectl logs "job/${job}" -n "$KANIKO_NAMESPACE" --tail=-1 \
              2>&1 | tee "$logs_file" || true
            if [ "$status" -eq 0 ]; then
              successful_job="$job"
              break
            fi

            /tmp/kubectl describe "job/${job}" -n "$KANIKO_NAMESPACE" || true
            if [ "$timed_out" -eq 1 ]; then
              # Leaving it running would keep it snapshotting against the same disk the
              # next build needs, which is how one slow wave turned into several.
              echo "kaniko: deleting the Job we stopped waiting for" >&2
              /tmp/kubectl delete job "$job" -n "$KANIKO_NAMESPACE" --ignore-not-found --wait=false
              exit 1
            fi
            if ! is_transient_build_failure "$logs_file"; then
              echo "kaniko: non-transient build failure; not retrying" >&2
              exit 1
            fi
            if [ "$build_attempt" -ge "$max_build_attempts" ]; then
              echo "kaniko: transient build failure persisted for ${build_attempt} attempts" >&2
              exit 1
            fi

            echo "kaniko: transient registry or network failure, retry ${build_attempt}/${max_build_attempts} with a fresh Job in ${retry_delay}s" >&2
            /tmp/kubectl delete job "$job" -n "$KANIKO_NAMESPACE" --ignore-not-found
            sleep "$retry_delay"
            retry_delay=$((retry_delay * 2))
            build_attempt=$((build_attempt + 1))
          done

          digest="$(/tmp/kubectl get pods -n "$KANIKO_NAMESPACE" \
            -l "job-name=${successful_job}" \
            -o jsonpath='{.items[0].status.containerStatuses[0].state.terminated.message}')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "::error::Kaniko did not publish an image digest"
              exit 1
              ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "reference=${primary_tag}@${digest}" >> "$GITHUB_OUTPUT"

  scan:
    if: ${{ inputs.trivy-scan && inputs.push }}
    needs: build
    runs-on: aks-self-hosted
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      TRIVY_SERVER: ${{ inputs.trivy-server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false

      - name: Detect Trivy ignore file
        id: trivy-ignore
        run: |
          if [ -f .trivyignore ]; then
            echo 'path=.trivyignore' >> "$GITHUB_OUTPUT"
          fi

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          TRIVY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ needs.build.outputs.image-ref }}
          scanners: 'vuln'
          severity: ${{ inputs.trivy-severity }}
          ignore-unfixed: ${{ inputs.trivy-ignore-unfixed }}
          exit-code: '1'
          trivyignores: ${{ steps.trivy-ignore.outputs.path }}
          timeout: ${{ inputs.trivy-timeout }}
