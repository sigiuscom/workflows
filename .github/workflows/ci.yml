name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: aks-untrusted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests

  actionlint:
    runs-on: aks-self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        run: |
          set -euo pipefail
          version='1.7.12'
          install_dir="$RUNNER_TEMP/actionlint-bin"
          mkdir -p "$install_dir"
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: |
          files=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -print)
          if [ -z "$files" ]; then
            echo '::error::no workflow files found'
            exit 1
          fi
          actionlint \
            -ignore 'label "aks-(self-hosted|untrusted)" is unknown' \
            -ignore 'shellcheck reported issue in this script' \
            $files
